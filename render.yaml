services:
  - type: web
    name: litnet-helper-access
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ACCESS_PRICE_RUB
        value: 100
      - key: ACCESS_DAYS
        value: 7
      - key: DATABASE_URL
        fromDatabase:
          name: litnet-helper-db
          property: connectionString
      - key: DONATION_PAGE_URL
        sync: false
      - key: DONATIONALERTS_ACCESS_TOKEN
        sync: false
      - key: CRON_SECRET
        generateValue: true

databases:
  - name: litnet-helper-db
    plan: free
